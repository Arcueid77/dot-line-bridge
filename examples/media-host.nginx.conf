# Merge this location into an operator-approved EXISTING HTTPS server block.
# Do not replace an existing site or start another listener on its ports.
location ^~ /dotbridge/line-media/ {
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_pass http://127.0.0.1:8896;
    proxy_set_header Host 127.0.0.1:8896;
    proxy_set_header Origin "";
    proxy_set_header X-Forwarded-For "";
    access_log off;
    error_log /dev/null;
}
